<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEO-ASSISTANT V1.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0d0d;
            --sidebar-bg: rgba(15, 15, 15, 0.95);
            --glass-bg: rgba(30, 30, 30, 0.6);
            --accent: #00f2ff;
            --text-dim: #888;
        }

        body { margin: 0; height: 100vh; display: flex; background: #000 url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=1920&q=80') center/cover; color: #eee; font-family: 'Inter', sans-serif; overflow: hidden; }

        /* --- サイドバー --- */
        .sidebar { width: 260px; height: 100%; background: var(--sidebar-bg); backdrop-filter: blur(20px); border-right: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column; z-index: 100; }
        .new-chat-btn { margin: 20px; padding: 12px; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; text-align: center; cursor: pointer; transition: 0.2s; font-size: 0.9rem; background: rgba(255,255,255,0.03); }
        .new-chat-btn:hover { background: rgba(255,255,255,0.1); border-color: var(--accent); }
        .history-list { flex: 1; overflow-y: auto; padding: 0 10px; }
        .history-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; border-radius: 8px; font-size: 0.85rem; cursor: pointer; color: var(--text-dim); transition: 0.2s; }
        .history-item:hover { background: rgba(255,255,255,0.05); color: #fff; }

        /* --- メインエリア --- */
        .main-wrapper { flex: 1; display: flex; position: relative; overflow: hidden; }
        .chat-section { flex: 1; display: flex; flex-direction: column; position: relative; background: rgba(13,13,13,0.6); border-right: 1px solid rgba(255,255,255,0.05); transition: 0.5s; }
        .search-section { width: 0; background: #fff; transition: 0.5s; position: relative; }
        .search-section.active { width: 50%; }
        iframe { width: 100%; height: 100%; border: none; }

        #home-screen { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(13,13,13,0.9); z-index: 50; backdrop-filter: blur(25px); }
        .home-logo { font-size: 2.5rem; font-weight: 600; margin-bottom: 40px; letter-spacing: 4px; color: var(--accent); cursor: pointer; text-shadow: 0 0 20px rgba(0,242,255,0.3); }
        .search-bar { width: 80%; max-width: 600px; padding: 20px 30px; border-radius: 35px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: #fff; font-size: 1.1rem; outline: none; }

        #chat-container { flex: 1; display: flex; flex-direction: column; height: 100%; visibility: hidden; }
        #chat-log { flex: 1; overflow-y: auto; padding: 40px 15%; display: flex; flex-direction: column; gap: 30px; scroll-behavior: smooth; }
        .msg { max-width: 90%; line-height: 1.8; animation: fadeIn 0.4s ease; font-size: 1rem; }
        .user-msg { color: var(--accent); font-weight: 600; }
        .ai-msg { color: #eee; border-left: 2px solid rgba(255,255,255,0.1); padding-left: 20px; }

        .input-area { padding: 20px 15% 40px 15%; }
        .input-wrapper { background: var(--glass-bg); border: 1px solid rgba(255,255,255,0.15); border-radius: 24px; padding: 12px 25px; display: flex; align-items: center; gap: 15px; }
        input#chat-input { flex: 1; background: transparent; border: none; color: #fff; padding: 10px; outline: none; }

        /* ヘルプ */
        .help-btn { position: fixed; bottom: 20px; left: 280px; width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,0.05); border: 1px solid #333; color: #666; cursor: pointer; font-size: 0.8rem; z-index: 100; }
        #help-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 300; backdrop-filter: blur(10px); }
        .help-box { background: #111; border: 1px solid var(--accent); padding: 30px; border-radius: 20px; max-width: 450px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div id="loader" style="position:fixed;inset:0;background:#000;z-index:1000;display:flex;justify-content:center;align-items:center;">LOADING AI... [<span id="lp">0%</span>]</div>

<aside class="sidebar">
    <div class="new-chat-btn" onclick="startNewChat()">+ New Chat</div>
    <div class="history-list" id="history-list"></div>
</aside>

<div class="main-wrapper">
    <div class="chat-section">
        <div id="home-screen">
            <div class="home-logo" id="display-name" onclick="setAiName()">NEO-ASSISTANT</div>
            <input type="text" class="search-bar" id="home-input" placeholder="メッセージを入力、または @キーワード で検索..." onkeypress="if(event.key==='Enter') startFromHome()">
        </div>
        <div id="chat-container">
            <div id="chat-log"></div>
            <div class="input-area">
                <div class="input-wrapper">
                    <input type="text" id="chat-input" placeholder="メッセージを入力..." onkeypress="if(event.key==='Enter') send()">
                    <button onclick="send()" style="background:none;border:none;color:var(--accent);cursor:pointer;font-weight:bold;">SEND</button>
                </div>
            </div>
        </div>
    </div>
    <div class="search-section" id="search-section">
        <button onclick="closeSearch()" style="position:absolute;left:-40px;top:20px;background:#ff4b4b;color:white;border:none;border-radius:50%;width:30px;height:30px;cursor:pointer;">×</button>
        <iframe id="search-frame"></iframe>
    </div>
</div>

<button class="help-btn" onclick="toggleHelp()">?</button>
<div id="help-modal" onclick="toggleHelp()">
    <div class="help-box" onclick="event.stopPropagation()">
        <h3 style="color:var(--accent)">Manual</h3>
        <ul style="font-size:0.9rem; color:#ccc;">
            <li><strong>@検索:</strong> 入力の頭に「@」を付けると右に検索画面が出ます。</li>
            <li><strong>命名:</strong> ロゴをクリックしてAIの名前を変更できます。</li>
            <li><strong>プライバシー:</strong> 会話はあなたのブラウザ内のみに保存されます。</li>
            <li><strong>注意:</strong> AIの回答は正確とは限りません。重要な情報は確認してください。</li>
        </ul>
    </div>
</div>

<script type="module">
    import * as webllm from "https://esm.run/@mlc-ai/web-llm";

    let engine;
    let currentChatId = null;

    async function init() {
        const model = "Qwen2.5-0.5B-Instruct-q4f16_1-MLC";
        engine = await webllm.CreateMLCEngine(model, {
            initProgressCallback: (r) => {
                document.getElementById('lp').innerText = Math.round(r.progress * 100) + "%";
                if (r.progress >= 1) setTimeout(() => document.getElementById('loader').remove(), 500);
            }
        });
        const savedName = localStorage.getItem('ai_name') || "NEO-ASSISTANT";
        document.getElementById('display-name').innerText = savedName;
        renderHistoryList();
    }

    window.toggleHelp = () => {
        const m = document.getElementById('help-modal');
        m.style.display = m.style.display === 'flex' ? 'none' : 'flex';
    };

    window.setAiName = () => {
        const n = prompt("名前を入力:");
        if(n) { localStorage.setItem('ai_name', n); document.getElementById('display-name').innerText = n; }
    };

    window.startNewChat = () => {
        currentChatId = null;
        document.getElementById('home-screen').style.visibility = 'visible';
        document.getElementById('chat-container').style.visibility = 'hidden';
        document.getElementById('chat-log').innerHTML = '';
        document.getElementById('search-section').classList.remove('active');
    };

    window.startFromHome = () => {
        const text = document.getElementById('home-input').value.trim();
        if(text) { document.getElementById('chat-input').value = text; send(); }
    };

    window.send = async () => {
        const input = document.getElementById('chat-input');
        const text = input.value.trim();
        if(!text || !engine) return;

        document.getElementById('home-screen').style.visibility = 'hidden';
        document.getElementById('chat-container').style.visibility = 'visible';

        if(text.startsWith('@')) {
            const q = text.substring(1);
            document.getElementById('search-frame').src = `https://www.bing.com/search?q=${encodeURIComponent(q)}`;
            document.getElementById('search-section').classList.add('active');
            appendToUI('user', `🌐 検索: ${q}`);
            appendToUI('ai', "検索結果を右側に表示しました。");
            input.value = '';
            return;
        }

        if(!currentChatId) currentChatId = Date.now();
        appendToUI('user', text);
        input.value = '';

        const aiDiv = document.createElement('div');
        aiDiv.className = 'msg ai-msg';
        document.getElementById('chat-log').appendChild(aiDiv);

        const chunks = await engine.chat.completions.create({
            messages: [{role:"system", content:`名前:${localStorage.getItem('ai_name')}`}, ...getHistory(), {role:"user", content:text}],
            stream: true,
        });

        let reply = "";
        for await (const chunk of chunks) {
            reply += chunk.choices[0]?.delta?.content || "";
            aiDiv.innerText = reply;
            document.getElementById('chat-log').scrollTop = document.getElementById('chat-log').scrollHeight;
        }
        saveToHistory(currentChatId, text, reply);
    };

    function appendToUI(role, text) {
        const div = document.createElement('div');
        div.className = `msg ${role}-msg`;
        div.innerText = (role === 'user' ? '○ ' : '') + text;
        document.getElementById('chat-log').appendChild(div);
        document.getElementById('chat-log').scrollTop = document.getElementById('chat-log').scrollHeight;
    }

    function saveToHistory(id, u, a) {
        let h = JSON.parse(localStorage.getItem('neo_v4') || "{}");
        if(!h[id]) h[id] = {title:u, msgs:[]};
        h[id].msgs.push({u, a});
        localStorage.setItem('neo_v4', JSON.stringify(h));
        renderHistoryList();
    }

    function renderHistoryList() {
        const l = document.getElementById('history-list');
        const h = JSON.parse(localStorage.getItem('neo_v4') || "{}");
        l.innerHTML = '';
        Object.keys(h).reverse().forEach(id => {
            const i = document.createElement('div');
            i.className = 'history-item';
            i.innerText = h[id].title;
            i.onclick = () => loadChat(id);
            l.appendChild(i);
        });
    }

    window.loadChat = (id) => {
        currentChatId = id;
        const h = JSON.parse(localStorage.getItem('neo_v4'))[id];
        document.getElementById('home-screen').style.visibility = 'hidden';
        document.getElementById('chat-container').style.visibility = 'visible';
        document.getElementById('chat-log').innerHTML = '';
        h.msgs.forEach(m => { appendToUI('user', m.u); appendToUI('ai', m.a); });
    };

    function getHistory() {
        if(!currentChatId) return [];
        const h = JSON.parse(localStorage.getItem('neo_v4') || "{}")[currentChatId];
        return h ? h.msgs.slice(-3).flatMap(m => [{role:"user", content:m.u}, {role:"assistant", content:m.a}]) : [];
    }

    init();
</script>
</body>
</html>
